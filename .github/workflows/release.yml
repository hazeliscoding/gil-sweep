name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag ${{ github.ref_name }} is not a version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --solution GilSweep.sln --configuration Release

      - name: Publish
        run: dotnet publish src/GilSweep.Desktop -p:PublishProfile=win-x64 -p:Version=${{ env.VERSION }}

      # Setup.exe and the update packages installed copies download. The previous Velopack release
      # is fetched first so vpk can add a small delta update from it; v1 releases have none.
      - name: Installer and updates
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { Write-Host 'No earlier Velopack release to build a delta from'; $global:LASTEXITCODE = 0 }
          dotnet vpk pack --runtime win-x64 --packId GilSweep --packVersion ${{ env.VERSION }} --packTitle "Gil Sweep" --packAuthors "Hazel Granados" --packDir artifacts/publish/GilSweep.Desktop --mainExe GilSweep.exe --icon docs/brand/gil-sweep.ico --shortcuts StartMenuRoot --noPortable --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw 'vpk pack failed' }

      - name: Package
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force artifacts/release
          $docs = 'README.md', 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md', 'CHANGELOG.md'
          $stage = New-Item -ItemType Directory -Force artifacts/stage/portable
          Copy-Item artifacts/publish/GilSweep.Desktop/GilSweep.exe $stage
          Copy-Item $docs $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$out/gil-sweep-portable-win-x64.zip" -Force
          # This version's update packages and the feed. The feed also lists older versions,
          # whose packages stay on their own releases.
          $velopack = Get-Content artifacts/velopack/assets.win.json | ConvertFrom-Json
          foreach ($asset in $velopack | Where-Object Type -ne 'Installer') { Copy-Item "artifacts/velopack/$($asset.RelativeFileName)" $out }
          Copy-Item artifacts/velopack/releases.win.json $out
          Copy-Item artifacts/velopack/GilSweep-win-Setup.exe "$out/gil-sweep-setup-win-x64.exe"
          $sums = Get-ChildItem "$out/*" -Include *.zip, *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          # LF endings, so `sha256sum -c SHA256SUMS` works on any platform.
          [IO.File]::WriteAllText("$out/SHA256SUMS", ($sums -join "`n") + "`n")
          Get-Content "$out/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/release/*
          if-no-files-found: error

  # The only job with write access. It runs no repository code, only the GitHub CLI.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Gil Sweep ${{ github.ref_name }}" \
            --notes "Windows x64, self-contained: no .NET install needed. Install with gil-sweep-setup-win-x64.exe, which keeps Gil Sweep up to date; the zip is a portable copy. See CHANGELOG.md for what changed. Verify downloads against SHA256SUMS."
