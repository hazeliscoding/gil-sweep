name: CI

on:
  pull_request:
  push:
    branches: [main, rewrite/dotnet-avalonia]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GilSweep.sln

      - name: Build
        run: dotnet build GilSweep.sln --configuration Release --no-restore

      # Offline: every test answers from recorded fixtures. The live sweep test is explicit only.
      - name: Test
        run: dotnet test --solution GilSweep.sln --configuration Release --no-build

      - name: Format
        run: dotnet format GilSweep.sln --verify-no-changes --no-restore

      # Renders every screen headless; a crash or a broken binding fails the build.
      - name: Screenshots
        run: dotnet run --project tools/GilSweep.Screenshots --configuration Release --no-build -- artifacts/screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: artifacts/screenshots
          retention-days: 7
